apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudnotes
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: cloudnotes-backend
        metrics_path: /metrics
        static_configs:
          - targets: [backend.cloudnotes.svc.cluster.local:5000]
  alert_rules.yml: |
    groups:
      - name: cloudnotes-alerts
        rules:
          - alert: BackendDown
            expr: up{job="cloudnotes-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: CloudNotes backend is down
          - alert: HighErrorRate
            expr: |
              (sum(rate(flask_http_request_total{status=~"5.."}[5m]))
              / sum(rate(flask_http_request_total[5m]))) > 0.10
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: CloudNotes backend 5xx error rate is above 10 percent
          - alert: HighRequestLatency
            expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: CloudNotes backend p95 latency is above one second
          - alert: NoNotesCreated
            expr: increase(notes_created_total[1h]) == 0 and notes_created_total > 0
            for: 1h
            labels:
              severity: info
            annotations:
              summary: No notes were created in the last hour
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudnotes
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
