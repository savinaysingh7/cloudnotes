apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudnotes
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: cloudnotes-backend
        metrics_path: /metrics
        static_configs:
          - targets: [backend.cloudnotes.svc.cluster.local:5000]
  alert_rules.yml: |
    groups:
      - name: cloudnotes-alerts
        rules:
          - alert: BackendDown
            expr: up{job="cloudnotes-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: CloudNotes backend is down
          - alert: HighErrorRate
            expr: |
              (sum(rate(flask_http_request_total{status=~"5.."}[5m]))
              / sum(rate(flask_http_request_total[5m]))) > 0.10
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: CloudNotes backend 5xx error rate is above 10 percent
          - alert: HighRequestLatency
            expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: CloudNotes backend p95 latency is above one second
          - alert: NoNotesCreated
            expr: increase(notes_created_total[1h]) == 0 and notes_created_total > 0
            for: 1h
            labels:
              severity: info
            annotations:
              summary: No notes were created in the last hour
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudnotes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
              hostPort: 9091
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudnotes
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloudnotes
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: cloudnotes
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'CloudNotes Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudnotes
  namespace: cloudnotes
data:
  cloudnotes.json: |
    {
      "uid": "cloudnotes-prod",
      "title": "CloudNotes Production Dashboard",
      "tags": ["cloudnotes", "production"],
      "refresh": "5s",
      "version": 4,
      "time": {
        "to": "now",
        "from": "now-1h"
      },
      "timezone": "browser",
      "schemaVersion": 36,
      "panels": [
        {
          "id": 1,
          "title": "Backend Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "DOWN", "color": "red" },
                    "1": { "text": "HEALTHY", "color": "green" }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "up{job=\"cloudnotes-backend\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Active Notes in DB",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(cloudnotes_notes_total) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Total Notes Created",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 9, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(notes_created_total) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Total Notes Updated",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 14, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "yellow", "value": null }]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(notes_updated_total) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Total Notes Deleted",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 19, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "orange", "value": null }]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(notes_deleted_total) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP Request Rate (5m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 10, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(flask_http_request_total[5m])",
              "legendFormat": "{{method}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "P95 Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 10, "x": 10, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "P95 Latency",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Error Rate (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 4, "x": 20, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(sum(rate(flask_http_request_total{status=~\"5..\"}[5m])) or vector(0)) / (sum(rate(flask_http_request_total[5m])) or vector(1)) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Backend Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "process_resident_memory_bytes{job=\"cloudnotes-backend\"}",
              "legendFormat": "Memory (bytes)",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudnotes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              hostPort: 3001
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "CHANGE_ME"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/cloudnotes.json"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-data
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-data
          configMap:
            name: grafana-dashboard-cloudnotes
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudnotes
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
