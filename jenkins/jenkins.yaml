jenkins:
  systemMessage: "CloudNotes Automated CI/CD Pipeline"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "CHANGE_ME"
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:admin"
        - "Overall/Administer:anonymous"
        - "Overall/Read:anonymous"
        - "Job/Read:anonymous"
        - "Job/Build:anonymous"

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('CloudNotes-Pipeline') {
        description('Automated CloudNotes delivery pipeline: Code -> Test -> Scan -> Build -> Push -> Deploy.')
        triggers {
          githubPush()
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/savinaysingh7/cloudnotes.git')
                }
                branches('*/main')
              }
            }
          }
        }
      }

      listView('CloudNotes') {
        description('Focused dashboard for the disposable CloudNotes CI/CD demo.')
        jobs {
          name('CloudNotes-Pipeline')
        }
        columns {
          status()
          weather()
          name()
          lastSuccess()
          lastFailure()
          lastDuration()
          buildButton()
        }
      }
